[project]
name = "ora"
version = "0.1.0"
description = "Ora — one circle, one loop. AI Tinkerers hackathon entry, 2026-09-12."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "aiohttp>=3.10",
    "openai>=1.50",
    "pyyaml>=6.0",
    "rich>=13.9",
    "langfuse>=4.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loop"]
