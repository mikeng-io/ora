# Mike's stack: signal-cli, whatsapp-bridge,
# postgres:16, honcho. Written only because no compose
# file existed in this repo yet; the two bridge stanzas are copied from
# the reference project's own docker-compose.yml with the reference project's volumes stripped to
# Ora's own state directories — Ora links as a SEPARATE device
# and must never share norty's ./state/signal-cli or ./state/whatsapp.
#
# EVERY published port below is bound to 127.0.0.1 ONLY, deliberately.
# signal-cli's JSON-RPC (send-as-Mike), whatsapp-bridge's send endpoint,
# Postgres, and Honcho's API all carry no authentication of their own —
# the reference project's own compose keeps the equivalent two bridges on a private,
# unpublished network for exactly this reason. Ora runs as a plain
# process on the same host, not inside this compose
# project, so it needs *some* published port — but 0.0.0.0 would offer
# every one of those unauthenticated APIs to the whole Tailscale/LAN
# surface, which is a real hole a security review caught in this file.
# `.env.example` already assumes localhost-only (`SIGNAL_BASE_URL=http://
# localhost:18080`, etc.), so binding to loopback costs nothing Ora needs.
#
# `docker compose config` validates this file; it is NOT brought up
# tonight (item 18's verify step) — the first real bring-up is
# the 10:00-10:30 smoke.

services:
  # signal-cli — copied from the reference project's docker-compose.yml, same image tag
  # ("same image as norty"). Ora's container starts with NO
  # prior state: it is linked as a second device of the SAME account from
  # the phone, not registered fresh — `signal-cli link -n
  # ora` (run once, interactively, via `docker compose run --rm signal-cli
  # signal-cli link -n ora`) before this daemon command ever runs.
  signal-cli:
    image: signal-cli:0.14.7-amd64
    # amd64 under emulation, deliberately: signal-cli's libsignal-client is a
    # native JNI library and the upstream release tarball's `signal_jni` is
    # x86_64. An arm64 build of this image starts and then fails every RPC
    # with «Missing required native library dependency: libsignal-client».
    # Startup cost is irrelevant for a daemon that runs for the whole demo.
    platform: linux/amd64
    container_name: ora-signal-cli
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      # Ora's OWN identity/state — never norty's ./state/signal-cli. Losing
      # this loses Ora's linked-device registration, not the reference project's.
      - ./state/signal-cli:/data/signal-cli
    environment:
      - XDG_DATA_HOME=/data
    command:
      [
        "--account", "${SIGNAL_ACCOUNT}",
        "daemon", "--http", "0.0.0.0:18080", "--receive-mode", "on-start",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -m 5 -X POST http://127.0.0.1:18080/api/v1/rpc -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":\"hc\",\"method\":\"version\",\"params\":{}}' | grep -q '\"version\"' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # whatsapp-bridge — copied from the reference project's docker-compose.yml, same image tag.
  # FIRST RUN needs pairing: a dedicated bot number, paired
  # by CODE into that phone's WhatsApp — Linked Devices → Link with phone
  # number:
  #   docker compose run --rm whatsapp-bridge --pair --phone <digits>
  # Then normal `docker compose up -d` boots with the saved session.
  whatsapp-bridge:
    image: whatsapp-bridge:0.1.0
    container_name: ora-whatsapp-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      # Ora's OWN pairing state — never norty's ./state/whatsapp.
      - ./state/whatsapp:/app/session
    command: ["node", "bridge.js", "--port", "18081", "--session", "/app/session"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:18081/health || exit 1"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # postgres — ORA-16: Honcho needs Postgres anyway, so it is here
  # regardless; Ora takes its own database `ora` on the same instance.
  postgres:
    # pgvector/pgvector:pg16, not plain postgres:16 — Honcho refuses to start
    # without the `vector` extension («Required vector columns missing:
    # public.documents.embedding … Run `alembic upgrade head` first»), and
    # stock postgres does not ship it. Same PG16 major, so the existing
    # ./state/postgres data directory is used unchanged.
    image: pgvector/pgvector:pg16
    container_name: ora-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=ora
      - POSTGRES_PASSWORD=ora
      - POSTGRES_DB=ora
    volumes:
      - ./state/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # honcho — a FRESH instance, empty workspace `ora`. the reference project
  # runs Honcho host-side on norty; there is no compose stanza anywhere in
  # this tree to copy (Opus audit finding 10: "Mike brings the stanza;
  # item 18 writes it only if he has not"). The
  # exact self-host image/tag below is UNVERIFIED against Honcho's own
  # self-hosting docs — confirm at 10:00, before relying on it; the
  # `ora-verify` workspace round-trip tonight (item 12) ran against
  # norty's existing instance, not this one.
  honcho:
    image: ghcr.io/plastic-labs/honcho:latest
    container_name: ora-honcho
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # `+psycopg` (psycopg3) is load-bearing: a bare `postgresql://` makes
      # SQLAlchemy reach for psycopg2, which this image does not ship —
      # the container crash-loops on ModuleNotFoundError at import.
      - DB_CONNECTION_URI=postgresql+psycopg://ora:ora@postgres:5432/honcho
      # Honcho's own LLM, pointed at the same Ollama Cloud endpoint and
      # model as Ora (ORA-14) — no reasoning above `low` runs anywhere.
      - LLM_OPENAI_COMPATIBLE_BASE_URL=https://ollama.com/v1
      - LLM_OPENAI_COMPATIBLE_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - LLM_OPENAI_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - LLM_DEFAULT_MODEL=deepseek-v4-flash
      # Embeddings run on the LOCAL ollama (bge-m3), not Ollama Cloud, which
      # serves no OpenAI-shaped embeddings endpoint — ingest 500s with
      # «OpenAI API key is required» without this. host.docker.internal is
      # how the container reaches the ollama on the Mac.
      #
      # 1024 dimensions is bge-m3's, not the 1536 Honcho defaults to for
      # text-embedding-3-small. Honcho asserts the stored vector columns
      # match this at startup and refuses to boot on a mismatch, so the
      # honcho database has to be migrated at this dimension, not adapted
      # to it afterwards.
      - EMBEDDING_MODEL_CONFIG__transport=openai
      - EMBEDDING_MODEL_CONFIG__model=bge-m3
      - EMBEDDING_MODEL_CONFIG__overrides__base_url=http://host.docker.internal:11434/v1
      - EMBEDDING_MODEL_CONFIG__overrides__api_key=ollama
      - EMBEDDING_VECTOR_DIMENSIONS=1024
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - OPENAI_API_KEY=ollama
      # The dialectic endpoint (`POST /peers/{id}/chat`) is what makes memory
      # ASKABLE rather than only pushed into a prompt as a pre-rendered card.
      # It carries its own per-level model config, defaulting to gpt-5.4-mini
      # over OpenAI's transport — so it 500'd with NotFoundError, the same
      # shape of bug as the deriver, on a path nothing else exercises.
      # `minimal` is pinned as the level Ora asks at: an agentic search with
      # five tool iterations is latency a group chat cannot spend.
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__transport=openai
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__model=deepseek-v4-flash
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__overrides__base_url=https://ollama.com/v1
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__overrides__api_key=${OLLAMA_CLOUD_API_KEY}
      - DIALECTIC_LEVELS__minimal__MODEL_CONFIG__structured_output_mode=json_object
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__transport=openai
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__model=deepseek-v4-flash
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__overrides__base_url=https://ollama.com/v1
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__overrides__api_key=${OLLAMA_CLOUD_API_KEY}
      - DIALECTIC_LEVELS__low__MODEL_CONFIG__structured_output_mode=json_object

  # honcho-deriver — the half that actually thinks.
  #
  # The API only ENQUEUES work; a separate process consumes it. Without this
  # service the queue just grows (measured: 5 rows waiting, nothing touching
  # them) and no conclusion or peer card is ever produced — so Ora's
  # <self_card> and <peer_card> blocks stay permanently empty and "memory is
  # the medium" is false in practice while looking fine in the API.
  honcho-deriver:
    image: ghcr.io/plastic-labs/honcho:latest
    container_name: ora-honcho-deriver
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    environment:
      - DB_CONNECTION_URI=postgresql+psycopg://ora:ora@postgres:5432/honcho
      # DERIVER_MODEL_CONFIG defaults to gpt-5.4-mini over OpenAI's own
      # transport, which this deployment has no key for — the deriver would
      # start and then fail every unit of work. Pointed at the same Ollama
      # Cloud model as everything else (ORA-14).
      - DERIVER_MODEL_CONFIG__transport=openai
      - DERIVER_MODEL_CONFIG__model=deepseek-v4-flash
      - DERIVER_MODEL_CONFIG__overrides__base_url=https://ollama.com/v1
      - DERIVER_MODEL_CONFIG__overrides__api_key=${OLLAMA_CLOUD_API_KEY}
      # json_object, not the json_schema default: Ollama Cloud is
      # OpenAI-compatible but does not honour Structured Outputs, so the
      # model returned perfectly good markdown bullets and pydantic rejected
      # every one of them («Invalid JSON: invalid number at line 1 column
      # 2»). json_object injects the schema into the prompt instead.
      - DERIVER_MODEL_CONFIG__structured_output_mode=json_object
      - LLM_OPENAI_COMPATIBLE_BASE_URL=https://ollama.com/v1
      - LLM_OPENAI_COMPATIBLE_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - LLM_OPENAI_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - LLM_DEFAULT_MODEL=deepseek-v4-flash
      # Same 1024-dim bge-m3 on the local ollama as the API: the deriver
      # embeds what it writes, and a dimension mismatch between the two
      # processes would corrupt the shared columns.
      - EMBEDDING_MODEL_CONFIG__transport=openai
      - EMBEDDING_MODEL_CONFIG__model=bge-m3
      - EMBEDDING_MODEL_CONFIG__overrides__base_url=http://host.docker.internal:11434/v1
      - EMBEDDING_MODEL_CONFIG__overrides__api_key=ollama
      - EMBEDDING_VECTOR_DIMENSIONS=1024
      # Deliberately NO OPENAI_BASE_URL here, unlike the API service: the
      # deriver's LLM transport falls back to it, so pointing it at the local
      # ollama sent every derivation to a server that has no
      # deepseek-v4-flash — «model not found», three retries, work unit
      # failed. Embeddings already have their own explicit endpoint above.
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      # A demo accumulates hours of data, not weeks: poll hard, back off
      # little, and treat a session as stale in one minute rather than five
      # so a card appears while the room is still talking about it.
      - DERIVER_WORKERS=2
      - DERIVER_POLLING_SLEEP_INTERVAL_SECONDS=1.0
      - DERIVER_POLLING_SLEEP_MAX_INTERVAL_SECONDS=5.0
      - DERIVER_POLLING_STARTUP_JITTER_SECONDS=0
      - DERIVER_STALE_SESSION_TIMEOUT_MINUTES=1
      # This is the knob that looked like "the deriver takes hours".
      # By default a representation work unit is only claimable once it has
      # accumulated REPRESENTATION_BATCH_WORK_UNIT_TARGET_TOKENS of messages
      # OR waited REPRESENTATION_BATCH_MAX_AGE_SECONDS (1800s). A handful of
      # short chat lines hits neither, so the queue sat at 3 rows, unclaimed,
      # with the deriver polling happily and logging nothing wrong.
      # Batching is the right default for a service ingesting for weeks; it
      # is the wrong one for a room being demoed this afternoon.
      - DERIVER_FLUSH_ENABLED=true
      - DERIVER_REPRESENTATION_BATCH_MAX_AGE_SECONDS=10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  default:
    name: ora
